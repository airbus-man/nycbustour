<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NYC Bus Tour 대시보드</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚌</text></svg>">
<style>
:root {
  --bg: #f6f7f9; --card: #ffffff; --text: #1a1d23; --muted: #6b7280; --line: #e5e7eb;
  --accent: #f5b301; --accent-2: #2563eb; --good: #16a34a; --bad: #dc2626;
  --c1: #2563eb; --c2: #f5b301; --c3: #10b981; --c4: #a855f7; --c5: #ef4444;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0f1115; --card: #181b21; --text: #e8eaed; --muted: #9aa0a6; --line: #2a2e36;
          --accent-2: #60a5fa; --c1: #60a5fa; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  padding: 18px 24px; border-bottom: 1px solid var(--line); background: var(--card); }
h1 { margin: 0; font-size: 18px; } h1 span { color: var(--accent); }
.controls { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 12px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: transparent; color: var(--text); padding: 6px 12px; cursor: pointer; font: inherit; }
.seg button.on { background: var(--text); color: var(--card); }
main { max-width: 1200px; margin: 0 auto; padding: 20px 16px 48px; display: grid; gap: 16px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; min-width: 0; }
.card h2 { margin: 0 0 12px; font-size: 13px; font-weight: 600; color: var(--muted); }
.kpi .v { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
.kpi .d { font-size: 12px; color: var(--muted); }
.up { color: var(--good); } .down { color: var(--bad); }
.grid2 { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; }
@media (max-width: 860px) { .grid2 { grid-template-columns: 1fr; } }
svg { display: block; width: 100%; height: auto; }
.axis text { fill: var(--muted); font-size: 10px; }
.axis line { stroke: var(--line); }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { color: var(--muted); font-weight: 500; font-size: 12px; }
td.n, th.n { text-align: right; }
.scroll { overflow-x: auto; }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; min-width: 60px; }
.bar > i { display: block; height: 100%; background: var(--accent); }
.pill { font-size: 11px; padding: 2px 8px; border-radius: 99px; background: var(--line); }
.pill.cancelled { background: color-mix(in srgb, var(--bad) 18%, transparent); color: var(--bad); }
.pill.completed { background: color-mix(in srgb, var(--good) 18%, transparent); color: var(--good); }
.pill.confirmed { background: color-mix(in srgb, var(--accent-2) 18%, transparent); color: var(--accent-2); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 8px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
#tip { position: fixed; pointer-events: none; background: var(--text); color: var(--card); font-size: 12px;
  padding: 6px 8px; border-radius: 6px; opacity: 0; transition: opacity .1s; z-index: 9; }
.err { color: var(--bad); }
</style>
</head>
<body>
<header>
  <h1>🚌 NYC Bus Tour <span>Dashboard</span></h1>
  <div class="controls">
    <div class="seg" id="range">
      <button data-d="7">7일</button><button data-d="30" class="on">30일</button><button data-d="90">90일</button>
    </div>
    <span id="updated">불러오는 중…</span>
  </div>
</header>

<main>
  <section class="kpis">
    <div class="card kpi"><h2>매출</h2><div class="v" id="k-rev">–</div><div class="d" id="k-rev-d"></div></div>
    <div class="card kpi"><h2>예약 건수</h2><div class="v" id="k-book">–</div><div class="d" id="k-book-d"></div></div>
    <div class="card kpi"><h2>탑승객</h2><div class="v" id="k-pax">–</div><div class="d" id="k-pax-d"></div></div>
    <div class="card kpi"><h2>취소율</h2><div class="v" id="k-cancel">–</div><div class="d" id="k-cancel-d"></div></div>
    <div class="card kpi"><h2>예정된 예약</h2><div class="v" id="k-up">–</div><div class="d" id="k-up-d"></div></div>
  </section>

  <section class="grid2">
    <div class="card"><h2>일별 매출</h2><div id="c-daily"></div></div>
    <div class="card"><h2>예약 채널</h2><div id="c-channel"></div></div>
  </section>

  <section class="card">
    <h2>투어별 실적</h2>
    <div class="scroll"><table id="t-tours">
      <thead><tr><th>투어</th><th>노선</th><th class="n">예약</th><th class="n">탑승객</th><th class="n">매출</th><th>좌석 점유율</th></tr></thead>
      <tbody></tbody>
    </table></div>
  </section>

  <section class="card">
    <h2>최근 예약</h2>
    <div class="scroll"><table id="t-recent">
      <thead><tr><th>#</th><th>고객</th><th>투어</th><th>투어일</th><th class="n">인원</th><th class="n">금액</th><th>채널</th><th>상태</th></tr></thead>
      <tbody></tbody>
    </table></div>
  </section>
</main>
<div id="tip"></div>

<script>
const $ = (s) => document.querySelector(s);
const usd = (c) => "$" + Math.round(c / 100).toLocaleString("en-US");
const num = (n) => Number(n).toLocaleString("ko-KR");
const pct = (x) => (x * 100).toFixed(1) + "%";
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const STATUS = { confirmed: "확정", completed: "완료", cancelled: "취소" };
const CHANNEL = { web: "웹", partner: "파트너", "walk-in": "현장" };
let days = 30;

async function get(path) {
  const r = await fetch(`/api/${path}?days=${days}`);
  if (!r.ok) throw new Error(`${path}: HTTP ${r.status}`);
  return r.json();
}

function delta(el, cur, prev, invert = false) {
  if (!prev) { el.textContent = "직전 기간 데이터 없음"; el.className = "d"; return; }
  const ch = (cur - prev) / prev;
  const good = invert ? ch <= 0 : ch >= 0;
  el.innerHTML = `<span class="${good ? "up" : "down"}">${ch >= 0 ? "▲" : "▼"} ${Math.abs(ch * 100).toFixed(1)}%</span> 직전 ${days}일 대비`;
  el.className = "d";
}

const tip = $("#tip");
function showTip(e, html) { tip.innerHTML = html; tip.style.opacity = 1; tip.style.left = e.clientX + 12 + "px"; tip.style.top = e.clientY + 12 + "px"; }
function hideTip() { tip.style.opacity = 0; }

function drawDaily(rows) {
  const W = 720, H = 240, P = { l: 44, r: 8, t: 10, b: 24 };
  const max = Math.max(1, ...rows.map((r) => r.revenue_cents));
  const bw = (W - P.l - P.r) / rows.length;
  const y = (v) => H - P.b - (v / max) * (H - P.t - P.b);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="일별 매출 차트"><g class="axis">`;
  for (let i = 0; i <= 4; i++) {
    const v = (max / 4) * i, yy = y(v);
    s += `<line x1="${P.l}" x2="${W - P.r}" y1="${yy}" y2="${yy}"/><text x="${P.l - 6}" y="${yy + 3}" text-anchor="end">${usd(v)}</text>`;
  }
  const step = Math.ceil(rows.length / 8);
  rows.forEach((r, i) => {
    if (i % step === 0) s += `<text x="${P.l + i * bw + bw / 2}" y="${H - 6}" text-anchor="middle">${r.date.slice(5)}</text>`;
  });
  s += `</g>`;
  rows.forEach((r, i) => {
    const yy = y(r.revenue_cents);
    s += `<rect data-i="${i}" x="${P.l + i * bw + bw * 0.15}" y="${yy}" width="${bw * 0.7}" height="${H - P.b - yy}" rx="2" fill="${css("--c1")}"/>`;
  });
  s += `</svg>`;
  const el = $("#c-daily"); el.innerHTML = s;
  el.querySelectorAll("rect").forEach((rect) => {
    const r = rows[rect.dataset.i];
    rect.addEventListener("mousemove", (e) => showTip(e, `<b>${r.date}</b><br>매출 ${usd(r.revenue_cents)}<br>탑승객 ${num(r.passengers)}명 · 예약 ${num(r.bookings)}건`));
    rect.addEventListener("mouseleave", hideTip);
  });
}

function drawChannels(rows) {
  const total = rows.reduce((a, r) => a + r.bookings, 0) || 1;
  const colors = ["--c1", "--c2", "--c3", "--c4", "--c5"].map(css);
  const R = 70, C = 90, sw = 26, circ = 2 * Math.PI * R;
  let off = 0, s = `<svg viewBox="0 0 180 180" style="max-width:220px;margin:0 auto" role="img" aria-label="채널별 예약 비율">`;
  rows.forEach((r, i) => {
    const len = (r.bookings / total) * circ;
    s += `<circle cx="${C}" cy="${C}" r="${R}" fill="none" stroke="${colors[i % 5]}" stroke-width="${sw}"
      stroke-dasharray="${len} ${circ - len}" stroke-dashoffset="${-off}" transform="rotate(-90 ${C} ${C})"/>`;
    off += len;
  });
  s += `<text x="${C}" y="${C - 2}" text-anchor="middle" font-size="22" font-weight="700" fill="currentColor">${num(total)}</text>
        <text x="${C}" y="${C + 16}" text-anchor="middle" font-size="11" fill="${css("--muted")}">총 예약</text></svg>`;
  s += `<div class="legend">` + rows.map((r, i) =>
    `<span><i style="background:${colors[i % 5]}"></i>${esc(CHANNEL[r.channel] || r.channel)} ${pct(r.bookings / total)} · ${usd(r.revenue_cents)}</span>`).join("") + `</div>`;
  $("#c-channel").innerHTML = s;
}

function drawTours(rows) {
  $("#t-tours tbody").innerHTML = rows.map((t) => `
    <tr><td><b>${esc(t.name)}</b></td><td style="color:var(--muted)">${esc(t.route)}</td>
    <td class="n">${num(t.bookings)}</td><td class="n">${num(t.passengers)}</td><td class="n">${usd(t.revenue_cents)}</td>
    <td><div style="display:flex;gap:8px;align-items:center"><div class="bar" style="flex:1"><i style="width:${Math.min(100, t.occupancy * 100)}%"></i></div>${pct(t.occupancy)}</div></td></tr>`).join("");
}

function drawRecent(rows) {
  $("#t-recent tbody").innerHTML = rows.map((b) => `
    <tr><td>${b.id}</td><td>${esc(b.customer_name)}</td><td>${esc(b.tour_name)}</td><td>${b.tour_date}</td>
    <td class="n">${b.party_size}</td><td class="n">${usd(b.amount_cents)}</td><td>${esc(CHANNEL[b.channel] || b.channel)}</td>
    <td><span class="pill ${esc(b.status)}">${esc(STATUS[b.status] || b.status)}</span></td></tr>`).join("");
}

async function load() {
  try {
    const [sum, daily, tours, channels, recent] = await Promise.all(
      ["summary", "daily", "tours", "channels", "recent"].map(get));
    const c = sum.current, p = sum.previous;
    $("#k-rev").textContent = usd(c.revenue_cents); delta($("#k-rev-d"), c.revenue_cents, p.revenue_cents);
    $("#k-book").textContent = num(c.bookings); delta($("#k-book-d"), c.bookings, p.bookings);
    $("#k-pax").textContent = num(c.passengers); delta($("#k-pax-d"), c.passengers, p.passengers);
    const cr = c.bookings ? c.cancelled / c.bookings : 0, pr = p.bookings ? p.cancelled / p.bookings : 0;
    $("#k-cancel").textContent = pct(cr); delta($("#k-cancel-d"), cr, pr, true);
    $("#k-up").textContent = num(sum.upcoming.bookings); $("#k-up-d").textContent = `탑승 예정 ${num(sum.upcoming.passengers)}명`;
    drawDaily(daily); drawChannels(channels); drawTours(tours); drawRecent(recent);
    $("#updated").textContent = "업데이트 " + new Date().toLocaleTimeString("ko-KR");
  } catch (e) {
    $("#updated").innerHTML = `<span class="err">불러오기 실패: ${esc(e.message)}</span>`;
  }
}

$("#range").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  days = +b.dataset.d;
  document.querySelectorAll("#range button").forEach((x) => x.classList.toggle("on", x === b));
  load();
});
load();
setInterval(load, 60_000);
</script>
</body>
</html>
